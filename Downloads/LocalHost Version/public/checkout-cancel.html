<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>Payment Cancelled - Tutor Time</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        .cancel-box {
            max-width: 500px;
            margin: 100px auto;
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .icon { font-size: 60px; color: #f44336; margin-bottom: 20px; }
        h1 { color: #333; }
        .btn-home {
            display: inline-block;
            padding: 12px 30px;
            background: #740084;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="cancel-box">
        <div class="icon">❌</div>
        <h1>Payment Cancelled</h1>
        <p>Your transaction has been cancelled. No charges were made.</p>
        <a href="index.html" class="btn-home">Return to Store</a>
    </div>
</body>
</html>
