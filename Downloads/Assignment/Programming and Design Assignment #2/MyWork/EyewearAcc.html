<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eyewear Accessories</title>
    <header>Click to switch the Eyewear Accessories</header>
    <style>
        header{
            text-align: center;
            font-size: 48px;
            background-color:darkseagreen;
            color:blueviolet;
            font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            border: 5px dotted black;
        }
        .navbar{
            float: left;
            width: 22%;
            height: 600px;
            background-color: burlywood;
            border: 5px solid black;
            border-top: none;
            border-right: none;
        }
        .navbar ul{
            text-align: left;
            font-size: 24px;
            padding: 10px;
            margin: 4px;
        }
        .navbar ul li{
            list-style-type: none;
            border: 3px solid black;
            border-radius: 30%;
            margin: 10px;
            text-align: center;
        }
        .navbar ul li a{
            text-decoration: none;
            color: seagreen;
        }
        .navbar ul li:hover{
            background-color: white;
            font-size: larger;
        }
        .navbar ul li a:hover{
            color: black;
            font-size: larger;
        }
        .navbar img{
            border-radius: 50%;
            border: 3px black;
            border-style:dashed;
            height: 200px;
            width: 200px;
            margin-left: 15%;
        }
        .window{
            float: left;
            width: 76.7%;
            height: 600px;
            border-top: none;
            border-left: none;
        }
        button{
            display: block;
            margin-left: auto;
            margin-right: auto;
            width: 50%;
            margin-top: 10px;
        }
        .homepage{
            text-decoration: none;
            font-size: larger;
            color: aliceblue;
            display: block;
        }
    </style>

    <script>
        var PhotoList = new Array(5);

        for(var i = 0; i < PhotoList.length; i++) {
            PhotoList[i] = new Image();
            PhotoList[i].src = "eyewearacc" + (i+1) +".jpeg";
        }
        function RandomImage(){
            document.RanPhoto.src = PhotoList[Math.floor(Math.random() * 5)].src;
        }
    </script>
</head>
<body>
    <div class="navbar">
        <ul>
            <li><a href="Eyewearacc1.html" target="window">ProductAcc 01</a></li>
            <li><a href="Eyewearacc2.html" target="window">ProductAcc 02</a></li>
            <li><a href="Eyewearacc3.html" target="window">ProductAcc 03</a></li>
            <li><a href="Eyewearacc4.html" target="window">ProductAcc 04</a></li>
            <li><a href="Eyewearacc5.html" target="window">ProductAcc 05</a></li>
        </ul>
        <div>
            <img src="eyewearacc1.jpeg" name="RanPhoto">
        </div>
        <button onclick="RandomImage()">Switch Photo</button>
        <br><br>
        <a href="Main.html" class="homepage">Back to Home Page</a>
    </div>

    <div class="window">
        <iframe src="productinstruction.html" width="100%" height="100%" name="window">
    </div>

</body>
</html>
