<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Page</title>
    <style>
        body{
            background-image: url(Mainbackground.avif);
            background-repeat: no-repeat;
            background-size: cover;
            width: 100%;
        }
        .companyname{
            height:fit-content;
            width: 100%;
            background-image: url(companynamebackground.avif);
            text-align: center;
            margin-top: -7px;
            margin-left: -7.25px;
            border: 3px solid black;
            float:left;
        }
        .FYEO{
            position: absolute;
            transform: translate(-180%, 120%);
            font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-weight:bolder;
            font-style: italic;
        }  
        .companylimited{
            font-size: 40px;
            font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }
        .navbar {
            float: left;
            overflow: hidden;
            background-image: url(Barbackground.avif);
            margin-left: -7px;
            width: 100%;
            height: 58px;
        }
        .navbar a {
            float: left;
            color: black;
            text-align: center;
            padding: 14px 16px;
            font-size: 20px;
            text-decoration: none;
        }

        .dropdown {
            float: left;
        }

        .dropdown .dropbtn {
            padding-top: 3px;
            font-size: 20px;
            border: none;
            outline: none;
            color: black;
            background-color: inherit;
        }

        .navbar a:hover, .dropdown:hover .dropbtn {
            background-color: brown;
            color: white;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
        }

        .dropdown-content a {
            float: none;
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            text-align: left;
        }

        .dropdown-content a:hover {
            background-color: green;
            color: white;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }
        .time{
            float:right;
            font-size: 35px;
            margin-right: 5px;
            background-color: aliceblue;
        }
        .rollover img{
            width: 300px;
            height: 200px;
            border-radius: 50%;
            border: 10px solid green;
        }
        .slogan1{
            font-size: 24px;
            color: brown;
            background-color: grey;
            border: 3px dotted black;
            animation: slogan1background 2s infinite;
        }
        @keyframes slogan1background {
            0% {
                background-color: lightcoral;
            }
            25% {
                background-color: lightgreen;
            }
            50% {
                background-color: yellow;
            }
            75% {
                background-color: pink;
            }
            100% {
                background-color: lightblue;
            }
        }
        @keyframes smallwindow {
            0% {
                border-color: lightcoral;
            }
            25% {
                border-color: lightblue;
            }
            50% {
                border-color: lightpink;
            }
            75% {
                border-color: lightyellow;
            }
            100% {
                border-color: lightgreen;
            }
        }
        .smallwindow {
            color: orange;
            font-weight: 500;
            font-size: 28px;
        }
        .pop-up {
            border: 10px solid black;
            animation: smallwindow 2s infinite;
            background-image: url(windowbackground.jpeg);
            background-repeat: no-repeat;
            background-size: cover;
            width: 600px;
            height: 300px;
            float: right;
            text-align: center;
            position: relative;
            margin-top: -180px;
            margin-right: 50px;
        }
        .close {
            margin-top: -20px;
            color: red;
            font-weight: bold;
            float: right;
            font-size: 30px;
            line-height: 20px;
            cursor: pointer;
        }
        .close:hover {
            color: black;
        }
    </style>
</head>
<body onload="startTime()" onload="togglePopup()">
    <div class="companyname">
        <span class="companylimited">
            For Your Eyes Only 
        </span>
        <img src="companylogo.png" width="100px" height="75px">
        <span class="FYEO">
            FYEO
        </span>
        <span class="companylimited">
            Company Limited
        </span>
    </div>

    <div class="navbar">
        <a href="Main.html">Home</a>
        <a href="Founder.html">Founder's Page</a>
        <div class="dropdown">
          <button class="dropbtn"><a href="Products.html">Products Catalogue</a>
          </button>
          <div class="dropdown-content">
            <a href="Eyewear.html">Eyewear</a>
            <a href="EyewearAcc.html">Eyewear Accessories</a>
          </div>
        </div> 
        <a href="Games.html">Game</a>
        <div class="time" id="txt"></div>
      </div>  

    <div class="rollover">
        <a href="Founder.html">
            <img src="porfolio1.png" class="portfimg1" 
            onmouseover="this.src='porfolio2.png'" onmouseout="this.src='porfolio1.png'">
        </a>
        <span class="slogan1"><a href="Games.html"
            style="text-decoration: none;">Let's play the Game!</a></span>
    </div>

    
      

    <div class="pop-up" id="delay">
        <span class="close" onclick="this.parentElement.style.display='none';">&times;</span>
            <div class="smallwindow">
                <span style="background-color: white; font-family: 'Gill Sans', 
                'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">Choosing the high quality glass is essential</span>
                <br/><br/>
                <span style="font-style: italic; background-color: green;">Also beneficial to your life!</span>
                <br/><br/>
                <span style="text-decoration: underline; background-color: purple;">Please choose it carefully</span>
                <br/><br/>
                <span style="background-color: aquamarine;">Go to the <span style="font-size: 40px;"><a href="Products.html">Product</a></span> Page for more details</span>
            </div>
    </div>
    <script>
        function startTime() {
            const today = new Date();

            var dd = String(today.getDate()).padStart(2, '0');
            var mm = String(today.getMonth() + 1).padStart(2, '0');
            var yyyy = today.getFullYear();

            let h = today.getHours();
            let m = today.getMinutes();
            let s = today.getSeconds();
            m = checkTime(m);
            s = checkTime(s);
            document.getElementById('txt').innerHTML = "Date: " + mm + '/' + dd + '/' + yyyy +
            "   Time: " + h + ":" + m + ":" + s;
            setTimeout(startTime, 1000);
        }

        function checkTime(i) {
            if (i < 10) {i = "0" + i};
            return i;
        }

        function togglePopup(){
            document.getElementById("popup-1").classList.toggle("active");
        }
    </script>
</body>
</html>
