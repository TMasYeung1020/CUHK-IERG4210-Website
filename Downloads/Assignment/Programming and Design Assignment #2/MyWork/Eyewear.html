<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eyewear</title>
    <header>Click to switch the Eyewear</header>
    <style>
        header{
            text-align: center;
            font-size: 48px;
            background-color:darkseagreen;
            color:blueviolet;
            font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            border: 5px dotted black;
        }
        .navbar{
            float: left;
            width: 22%;
            height: 600px;
            background-color: burlywood;
            border: 5px solid black;
            border-top: none;
            border-right: none;
        }
        .navbar ul{
            text-align: left;
            font-size: 24px;
            padding: 10px;
            margin: 4px;
        }
        .navbar ul li{
            list-style-type: none;
            border: 3px solid black;
            border-radius: 30%;
            margin: 10px;
            text-align: center;
        }
        .navbar ul li a{
            text-decoration: none;
            color: seagreen;
        }
        .navbar ul li:hover{
            background-color: white;
            font-size: larger;
        }
        .navbar ul li a:hover{
            color: black;
            font-size: larger;
        }
        .navbar img{
            border-radius: 50%;
            border: 3px black;
            border-style:dashed;
            height: 200px;
            width: 200px;
            margin-left: 15%;
        }
        .window{
            float: left;
            width: 76.7%;
            height: 600px;
            border-top: none;
            border-left: none;
        }
        button{
            display: block;
            margin-left: auto;
            margin-right: auto;
            width: 50%;
            margin-top: 10px;
        }
        .homepage{
            text-decoration: none;
            font-size: larger;
            color: aliceblue;
            display: block;
        }
    </style>

    <script>
        var Ew = new Array(5);
        var ImageRunner = 0;
        var ImagesLoad = 0;

        for(var i = 0; i < Ew.length; i++) {
            Ew[i] = new Image();
            Ew[i].src = "eyewear" + (i + 1) +".jpeg";
            Ew[i].onload = change();
        }
        function change() {
            ImagesLoad++;
            if (ImagesLoad == Ew.length)
                setInterval("changing()",3000);
        }
        function changing() {
            if (ImageRunner == (Ew.length - 1)) {
                ImageRunner = 0;}
            else {
                ImageRunner++;}
            document.ChangePhoto.src = Ew[ImageRunner].src;
        }
    </script>
</head>
<body>
    <div class="navbar">
        <ul>
            <li><a href="Eyewear1.html" target="window">Product 01</a></li>
            <li><a href="Eyewear2.html" target="window">Product 02</a></li>
            <li><a href="Eyewear3.html" target="window">Product 03</a></li>
            <li><a href="Eyewear4.html" target="window">Product 04</a></li>
            <li><a href="Eyewear5.html" target="window">Product 05</a></li>
        </ul>
        <div>
            <img src="eyewear1.jpeg" name="ChangePhoto">
        </div>
        <br><br><br>
        <a href="Main.html" class="homepage">Back to Home Page</a>
    </div>

    <div class="window">
        <iframe src="productinstruction.html" width="100%" height="100%" name="window">
    </div>

</body>
</html>
