<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>

    <script>
        var cat = new Array(8);
        var ImageRunner = 0;
        var ImagesLoad = 0;

        for(var i = 0; i < cat.length; i++) {
            cat[i] = new Image();
            cat[i].src = "cat-run-new/cat0" + (i + 1) +".png";
            cat[i].onload = run();
        }
        function run() {
            ImagesLoad++;
            if (ImagesLoad == cat.length)
                setInterval("running()",65);
        }
        function running() {
            if (ImageRunner == (cat.length - 1)) {
                ImageRunner = 0;}
            else {
                ImageRunner++;}
            document.Animation.src = cat[ImageRunner].src;
        }
    </script>


    <style>

    </style>

</head>
<body>
    <div>
        <img src="cat-run-new/cat01.png" name="Animation">
    </div>
</body>
</html>
