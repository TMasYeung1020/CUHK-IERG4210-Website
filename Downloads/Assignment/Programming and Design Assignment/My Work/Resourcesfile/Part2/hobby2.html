<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hobby2</title>

    <script>
        var FoodPhotoList = new Array(6);
        var TheANS = ["1", "2", "3", "4", "5", "6"];
        for(var i = 0; i < FoodPhotoList.length; i++) {
            FoodPhotoList[i] = new Image();
            FoodPhotoList[i].src = "Food" + (i+1) +".jpeg";
        }
        var FinalANS;

        function GenerateQuiz(){
            const RanNum = Math.floor(Math.random() * 6);
            document.foodphoto.src = FoodPhotoList[RanNum].src;
            FinalANS = TheANS[RanNum];
        }

        function getCheckedValue(radioName) {
            var radios = document.getElementsByName(radioName);
            for (var i = 0; i < radios.length; i++){
                if (radios[i].checked){
                return radios[i].value;
            }   
        }
    }
        
        function AnswerTrueFalse(){
            if (getCheckedValue("question") === FinalANS){
                RightANS();
            }
            else{
                WrongANS();
            }
        }

        function RightANS(){
            const RanNum = Math.floor(Math.random() * 4);
            const RightANS = ["Very good!", "Perfect!", "Good job!", "Nice work!"];
            document.getElementById("Comment").innerHTML=RightANS[RanNum];
        }

        function WrongANS(){
            const RanNum = Math.floor(Math.random() * 5);
            const WrongANS = ["Incorrect, please try again.", "Wrong. Try again.",
            "You are close!", "Try harder and don't give up"];
            document.getElementById("Comment").innerHTML=WrongANS[RanNum];
        }
        
    </script>

    <style>
        body{
            background-image: url(CookingBackground.jpeg);
            background-size: cover;
            background-repeat: no-repeat;
        }
        .Title{
            text-align: center;
            background-color: brown;
            border-radius: 20px;
            border: 10px solid white;
            color: white;
        }
        .quote{
            color: white;
            font-size: 50px;
            border: 5px;
            border-style: groove;
            margin-top: 5px;
        }
        .QuoteName{
            float: right;
            display: inline;
            font-weight: 200;
            text-decoration: underline;
            font-style: italic;
        }
        .Quiz{
            float:left;
            border-radius: 10px;
            border: 3px solid black;
            background-color: white;
            width: 1000px;
            height: 500px;
        }
        button{
            width:150px;
            margin-top: 10px;
            margin-left: 3px;
        }
        .choices label {
            display: flex;
            align-items: center;
        }
        .choices {
            list-style-type: none;
            padding: 0;
            margin-left: 5%;
        }
        img{
            margin-top: 10px;
            margin-left: 10%;
            width: 200px;
            height: 200px;
        }
        p{
            float:right;
            font-size: 40px;
        }
        .Return{
            float:right;
            background-color: beige;
            margin:3px;
        }
        .FrontPage{
            float:right;
            background-color: beige;
            margin:3px;
        }
        img:hover{
            background-color: red;
            filter: blur(1px);
        }
        a:hover{
            color:aliceblue;
            background-color: black;
        }
    </style>

</head>
<body>
    <div class="Title">
        <h2>My HOBBY2 - Cooking</h2>
    </div>

    <div class="quote">
        “Cooking is like painting or writing a song. Just as there are only so many 
        notes or colors, there are only so many flavors—it’s how you combine them that sets you apart.”
        <nav class="QuoteName">~ Wolfgang Puck</nav>
    </div>
        
    <div class="Quiz">
        <img src="NextQ.jpeg" name="foodphoto">
        <h4 style="margin-left: 5%;">What is the name of this food?</h4>
        <ul class="choices">
            <li>
                <label>
                    <input type="radio" name="question" value="1" id="1" />
                    <input type="text" value="Cake" readonly>
                </label>
            </li>
            <li>
                <label>
                    <input type="radio" name="question" value="2" id="2" />
                    <input type="text" value="Noodles" readonly>
                </label>
            </li>
            <li>
                <label>
                    <input type="radio" name="question" value="3" id="3" />
                    <input type="text" value="Rice" readonly>
                </label>
            </li>
            <li>
                <label>
                    <input type="radio" name="question" value="4" id="4" />
                    <input type="text" value="Soup" readonly>
                </label>
            </li>
            <li>
                <label>
                    <input type="radio" name="question" value="5" id="5" />
                    <input type="text" value="Bread" readonly>
                </label>
            </li>
            <li>
                <label>
                    <input type="radio" name="question" value="6" id="6" />
                    <input type="text" value="Fruit" readonly>
                </label>
            </li>
        
            <button onclick="AnswerTrueFalse()">Answer</button>
            <button onclick="GenerateQuiz()">Next Question</button>

            <p id="Comment"></p>
    </div>

    <div class="FrontPage">
        <a href="hobby1.html">
            Last Hobby
        </a>
    </div>

    <div class="Return">
        <a href="index.html">Back To Home Page</a>
    </div>

</body>
</html>
