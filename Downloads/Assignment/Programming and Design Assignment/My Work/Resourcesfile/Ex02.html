<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script>

        function Answer(){
            const N1 = document.getElementById("num1").value;
            const N2 = document.getElementById("num2").value;
            const InputQuo = document.getElementById("QuoInput").value;
            const InputRem = document.getElementById("RInput").value;
            let ANS = N2*InputQuo + InputRem*1;

            if (ANS == N1){
                alert("Very Good!");
            }
            else{
                alert("No. Please try again");
            }
        }
        
        function NumGenerator(){
            document.getElementById("num1").value = Math.floor(Math.random() * 9) + 1;
            document.getElementById("num2").value = Math.floor(Math.random() * 9) + 1;
        }

        function Clear(){
            document.getElementById("QuoInput").value = "";
            document.getElementById("RInput").value = "";
        }


    </script>

    <style>
        body{
            background-color: antiquewhite;
            border: 1px solid;
        }
        p{
            text-align: center;
            color: blue;
        }
        .button{
            text-align: center;
            width: 150px;
        }
        .firstp{
            margin-left: 10%;
        }
        .secondp{
            margin-left: 10%;
        }
        .thirdp{
            margin-left: 13.5%;
        }
        .fourthp{
            margin-left: 12.5%;
        }
        .fifthp{
            margin-left: 37%;
        }
    </style>

</head>
<body>
    <div class="firstp">
        <br/>
        Calculate <input type="text" name="int" size="20" id="num1" READONLY/> 
        divide by <input type="text" name="int" size="20" id="num2" READONLY/>?
    </div>

    <br/>

    <div class="secondp">
        Your Answers:
    </div>

    <div class="thirdp">
        Quotient:<input type="number" id="QuoInput">
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        <input type="button" value="Submit my answers" onclick="Answer()" class="button">
        <br/><br/>
    </div>

    <div class="fourthp">
        Remainber<input type="number" id="RInput">
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
        <input type="button" value="Clear" onclick="Clear()" class="button">
        <br/><br/>
    </div>

    <div class="fifthp">
        <input type="button" value="New Question" onclick="NumGenerator()" class="button">
    </div>

    <p id="ANS"></p>

</body>
</html>
