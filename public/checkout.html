<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Tutor Management</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header>
        <div class="logo-section" onclick="location.href='index.html'" style="cursor:pointer">
            <img src="uploads/logo.png" alt="Tutor Time Logo" id="site-logo" style="height:48px;width:auto;margin-right:12px;">
            <h1>Tutor Time Booking System</h1>
        </div>
    </header>

    <main class="container">
        <div class="checkout-container">
            <h2>Your Shopping Cart</h2>

            <div id="cart-list">
                <p>Loading items...</p>
            </div>

            <div id="checkout-summary" style="display:none;">
                <div class="total-section">
                    Total: HKD $<span id="total-price">0.0</span>
                </div>
                <button class="btn-pay" onclick="startCheckout()">Secure Checkout via Stripe</button>
            </div>

            <a href="index.html" class="btn-back">← Back to Store</a>
        </div>
    </main>

    <footer><p>© 2025 Tutor Time Booking System · IERG 4210</p></footer>

    <script src="js/api.js"></script>
    <script src="js/checkout.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => { renderCheckoutPage(); });
    </script>
</body>
</html>
