<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>Change Password - Admin Panel</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <header>
        <div class="logo-section" onclick="location.href='index.html'" style="cursor:pointer">
        <img src="uploads/logo.png" alt="Tutor Time Logo" id="site-logo" style="height: 60px; width: auto; margin-right: 15px;">            <h1>Tutor Time Booking System</h1>
            <h1>Security Settings</h1>
        </div>
    </header>

    <main class="container" style="max-width: 400px; margin-top: 50px;">
        <form id="change-pw-form">
            <h2>Change Password</h2>
            <div style="margin-bottom: 15px;">
                <label>Current Password:</label><br>
                <input type="password" id="old-password" required style="width: 100%; padding: 8px;">
            </div>
            <hr>
            <div style="margin-bottom: 15px;">
                <label>New Password:</label><br>
                <input type="password" id="new-password" required style="width: 100%; padding: 8px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label>Confirm New Password:</label><br>
                <input type="password" id="new-confirm" required style="width: 100%; padding: 8px;">
            </div>
            <button type="submit" style="width: 100%; padding: 10px; background: #d9534f; color: white; border: none; cursor: pointer;">Update Password</button>
        </form>
        <p id="pw-msg" style="margin-top: 10px;"></p>
    </main>

    <script src="../js/api.js"></script>
    <script>
        document.getElementById('change-pw-form').onsubmit = async (e) => {
            e.preventDefault();
            const oldPassword = document.getElementById('old-password').value;
            const newPassword = document.getElementById('new-password').value;
            const confirm = document.getElementById('new-confirm').value;
            const msg = document.getElementById('pw-msg');

            if (newPassword !== confirm) {
                msg.style.color = "red";
                msg.innerText = "New passwords do not match!";
                return;
            }

            // 使用 secureFetch 以帶上 CSRF Token
            const res = await API.secureFetch('/api/admin/change-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ oldPassword, newPassword })
            });

            if (res && res.ok) {
                alert("Password changed successfully! Please login again.");
                window.location.href = '../login.html';
            } else {
                const data = await res.json();
                msg.style.color = "red";
                msg.innerText = data.message || "Failed to change password";
            }
        };
    </script>
</body>
</html>
