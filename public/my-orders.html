<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Tutor Time</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header>
        <div class="logo-section" onclick="location.href='index.html'" style="cursor:pointer">
            <img src="uploads/logo.png" alt="Tutor Time Logo" id="site-logo" style="height:48px;width:auto;margin-right:12px;">
            <h1>Tutor Time Booking System</h1>
        </div>
    </header>

    <main class="container">
        <h2>My Order History</h2>
        <div id="orders-list">Loading orders...</div>
        <div class="mt-8">
            <a href="index.html" class="btn-back">← Back to Shop</a>
        </div>
    </main>

    <footer><p>© 2025 Tutor Time Booking System · IERG 4210</p></footer>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/api/user/orders');
                const data = await response.json();
                const list = document.getElementById('orders-list');

                if (!data.success) {
                    list.innerHTML = '<p>Please <a href="login.html">login</a> to view your orders.</p>';
                    return;
                }

                if (data.orders.length === 0) {
                    list.innerHTML = '<p>No orders found.</p>';
                    return;
                }

                list.innerHTML = data.orders.map(order => `
                    <div class="order-card">
                        <div class="order-header">
                            <strong>Order #${order.oid}</strong>
                            <span>${order.createdAt ? new Date(order.createdAt).toLocaleString() : 'Processing'}</span>
                        </div>
                        <p>Total: HKD $${order.total_price}</p>
                        <p>Status: <span class="status-${order.status.toLowerCase()}">${order.status}</span></p>
                        ${order.status === 'PENDING' ? `<button onclick="repay(${order.oid})">Pay Now</button>` : ''}
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        });

        function repay(oid) {
            alert("Redirecting to Stripe for Order #" + oid);
        }
    </script>
</body>
</html>
