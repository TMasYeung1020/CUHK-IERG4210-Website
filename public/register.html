<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Tutor Time</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header>
        <div class="logo-section" onclick="location.href='index.html'" style="cursor:pointer">
            <img src="uploads/logo.png" alt="Tutor Time Logo" id="site-logo" style="height:48px;width:auto;margin-right:12px;">
            <h1>Tutor Time Booking System</h1>
        </div>
    </header>

    <main class="container">
        <div class="form-page">
            <form id="register-form">
                <h2>Create Account</h2>
                <div class="form-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" required>
                </div>
                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" required>
                </div>
                <div class="form-group">
                    <label for="reg-confirm">Confirm Password</label>
                    <input type="password" id="reg-confirm" required>
                </div>
                <button type="submit" class="btn-pay">Register</button>
            </form>
            <p id="reg-msg" class="form-msg"></p>
        </div>
    </main>

    <footer><p>© 2025 Tutor Time Booking System · IERG 4210</p></footer>

    <script>
        document.getElementById('register-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const confirm = document.getElementById('reg-confirm').value;
            const msg = document.getElementById('reg-msg');

            if (password !== confirm) {
                msg.style.color = 'var(--danger)';
                msg.innerText = "Passwords do not match!";
                return;
            }

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, confirm })
            });

            const data = await res.json();
            if (data.success) {
                msg.style.color = 'var(--success)';
                msg.innerText = "Registration successful! Redirecting to login...";
                setTimeout(() => { window.location.href = 'login.html'; }, 2000);
            } else {
                msg.style.color = 'var(--danger)';
                msg.innerText = data.message;
            }
        };
    </script>
</body>
</html>
