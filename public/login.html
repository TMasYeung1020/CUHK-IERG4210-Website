<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tutor Time</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header>
        <div class="logo-section" onclick="location.href='index.html'" style="cursor:pointer">
            <img src="uploads/logo.png" alt="Tutor Time Logo" id="site-logo" style="height:48px;width:auto;margin-right:12px;">
            <h1>Tutor Time Booking System</h1>
        </div>
    </header>

    <main class="container">
        <div class="form-page">
            <form id="login-form">
                <h2>Sign In</h2>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn-pay">Login</button>
            </form>
            <p id="login-msg" class="form-msg" style="color:var(--danger);"></p>
            <div class="form-footer">
                <p>New user? <a href="register.html">Create an account</a></p>
            </div>
        </div>
    </main>

    <footer><p>© 2025 Tutor Time Booking System · IERG 4210</p></footer>

    <script>
    document.getElementById('login-form').onsubmit = async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (data.success) {
            sessionStorage.setItem('csrfToken', data.csrfToken);
            sessionStorage.setItem('userEmail', email);
            sessionStorage.setItem('isAdmin', data.isAdmin);
            window.location.href = 'admin/index.html';
        } else {
            document.getElementById('login-msg').innerText = data.message || "Login failed";
        }
    };
    </script>
</body>
</html>
